name: Firmware release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish firmware
    runs-on: ubuntu-24.04
    environment: firmware-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify tag matches version.txt
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match version.txt ($version)" >&2
            exit 1
          }
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Validate host behavior and guardrails
        run: bash tools/verify.sh --host-only
      - name: Build ESP32-S3 firmware with ESP-IDF v6.0.2
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          command: bash tools/verify.sh --idf-only
      - name: Sign and verify the release image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        env:
          SMOKER_OTA_SIGNING_KEY_B64: ${{ secrets.SMOKER_OTA_SIGNING_KEY_B64 }}
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: .
          extra_docker_args: --env SMOKER_OTA_SIGNING_KEY_B64
          command: bash tools/sign_release_firmware.sh
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s smoker_controller.bin
          sha256sum smoker_controller.bin > smoker_controller.bin.sha256
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            smoker_controller.bin smoker_controller.bin.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
